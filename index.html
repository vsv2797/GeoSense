<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoSense | Global Climate Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/climate.css">
  <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.26.0/dist/globe.gl.min.js"></script>
</head>

<body>
  <div id="earth-glow"></div>

  <div class="search-container">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search countries, regions, cities..." autocomplete="off">
    </div>
    <ul id="search-results" style="display: none;"></ul>
  </div>

  <header>
    <div class="logo">
      <div class="logo-mark" onclick="window.location.reload()" style="cursor:pointer">GS</div>
      <div>
        <div class="logo-name">Geo<span>Sense</span></div>
        <div class="logo-tag">GLOBAL CLIMATE INTELLIGENCE</div>
      </div>
    </div>
    <div class="header-right">
    </div>
  </header>

  <div id="main">
    <aside id="left">
      <div class="slabel">ANALYTICS ENGINE</div>
      <div id="metric-btns"></div>
      <div class="divider"></div>
      <div class="slabel">CRITICAL IMPACT ZONES</div>
      <div id="top-list"></div>
      <div class="divider" style="margin-top:auto;"></div>
      <div class="dist-wrap" id="dist-stats"></div>
    </aside>

    <main id="globe-wrap">
      <div id="globe-viz"></div>
      <div id="metric-badge">TRACKING: PM2.5</div>
      <div id="legend">
        <span class="leg-lbl">SAFE</span>
        <div class="leg-bar"></div>
        <span class="leg-lbl">HAZARDOUS</span>
      </div>
      <div id="hint">↻ Rotate globe · Scroll to zoom · Click for detail</div>
    </main>

    <aside id="right">
      <div id="right-inner"><div id="detail-content"></div></div>
    </aside>
  </div>

  <script>
    let DATA = [];
    let GEOJSON_DATA = null;
    let curMetric = 'pm2_5';

    const METRICS = [
      { key: 'pm10', label: 'PM10 Pollutants', icon: '🌫️' },
      { key: 'pm2_5', label: 'PM2.5 Particles', icon: '😷' },
      { key: 'co', label: 'Carbon Monoxide', icon: '🚗' },
      { key: 'no2', label: 'Nitrogen Dioxide', icon: '🏭' },
      { key: 'temp', label: 'Temperature Index', icon: '🌡️' }
    ];

    // Named color function — must be a variable so we can re-assign it to
    // force globe.gl to repaint the choropleth after data arrives.
    function capColor(feat) {
        const c = DATA.find(x => x.iso === feat.properties.ISO_A3);
        if (!c || !c.synced) return 'rgba(9, 14, 21, 0.4)';
        const val = c.scores[curMetric] || 0;
        if (curMetric === 'temp') {
            let t = (val + 30) / 80;
            t = Math.max(0, Math.min(1, t));
            const colors = [[139, 92, 246], [59, 130, 246], [16, 185, 129], [245, 158, 11], [239, 68, 68]];
            const i = Math.floor(t * 4);
            const frac = (t * 4) - i;
            if (i >= 4) return `rgba(239, 68, 68, 0.7)`;
            const r = Math.round(colors[i][0] * (1-frac) + colors[i+1][0] * frac);
            const g = Math.round(colors[i][1] * (1-frac) + colors[i+1][1] * frac);
            const b = Math.round(colors[i][2] * (1-frac) + colors[i+1][2] * frac);
            return `rgba(${r}, ${g}, ${b}, 0.7)`;
        }
        const colors = ['#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
        let ci = 0;
        if (val >= 20) ci = 1;
        if (val >= 50) ci = 2;
        if (val >= 80) ci = 3;
        return colors[ci] + 'a0';
    }

    // Wrapper that creates a fresh function reference each call,
    // which is required for globe.gl to detect a change and repaint.
    function refreshColors() { world.polygonCapColor(feat => capColor(feat)); }

    const world = Globe()(document.getElementById('globe-viz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .backgroundColor('#090e15')
      .showAtmosphere(true)
      .atmosphereColor('#00e5ff')
      .atmosphereAltitude(0.15)
      .polygonCapColor(feat => capColor(feat))
      .polygonStrokeColor(() => 'rgba(0, 229, 255, 0.15)')
      .polygonAltitude(0.012)
      .polygonLabel(feat => {
        const c = DATA.find(x => x.iso === feat.properties.ISO_A3);
        if (!c) return `<div class="tip-inner"><div class="tip-name">${feat.properties.ADMIN}</div></div>`;
        const val = c.synced ? c.scores[curMetric] : 'Loading...';
        const unit = curMetric === 'temp' ? '°C' : 'µg/m³';
        return `
          <div class="tip-inner" style="background: #0a0f18; border: 1px solid #1f2d3d; padding: 8px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-radius: 2px;">
            <span class="tip-flag" style="font-family: 'Roboto Mono', monospace; color: #94a3b8; font-size: 10px; background: #1f2d3d; padding: 2px 4px; border-radius: 2px;">${c.iso}</span>
            <div>
              <div class="tip-name" style="font-size: 11px; font-weight: 600; line-height: 1.2; margin-bottom: 2px; color: #f8fafc;">${c.name}</div>
              <div class="tip-score" style="font-family: 'Roboto Mono', monospace; font-size: 10px; font-weight: 700; color: #00e5ff;">
                ${METRICS.find(m => m.key === curMetric).label}: ${val}${c.synced ? ' ' + unit : ''}
              </div>
            </div>
          </div>
        `;
      })
      .onPolygonClick(f => {
        const c = DATA.find(x => x.iso === f.properties.ISO_A3);
        if (c) openDetail(c);
      });

    // Cloud layer
    const CLOUDS_IMG_URL = 'https://unpkg.com/three-globe/example/img/earth-clouds.png';
    const CLOUDS_ALT = 0.004;
    const CLOUDS_ROTATION_SPEED = -0.006; 

    new THREE.TextureLoader().load(CLOUDS_IMG_URL, cloudsTexture => {
      const clouds = new THREE.Mesh(
        new THREE.SphereGeometry(world.getGlobeRadius() * (1 + CLOUDS_ALT), 75, 75),
        new THREE.MeshPhongMaterial({ map: cloudsTexture, transparent: true, opacity: 0.8 })
      );
      world.scene().add(clouds);
      (function rotateClouds() {
        clouds.rotation.y += CLOUDS_ROTATION_SPEED * Math.PI / 180;
        requestAnimationFrame(rotateClouds);
      })();
    });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    function getCountryCenter(f) {
      const geom = f.geometry;
      if (!geom) return { lat: 0, lng: 0 };
      
      let bestRing = null;
      if (geom.type === 'Polygon') {
        bestRing = geom.coordinates[0];
      } else if (geom.type === 'MultiPolygon') {
        let maxPoints = 0;
        geom.coordinates.forEach(poly => {
          const ring = poly[0];
          if (ring && ring.length > maxPoints) {
            maxPoints = ring.length;
            bestRing = ring;
          }
        });
      }
      
      if (bestRing && bestRing.length > 0) {
        let latSum = 0, lngSum = 0;
        bestRing.forEach(coord => {
          lngSum += coord[0];
          latSum += coord[1];
        });
        return {
          lat: latSum / bestRing.length,
          lng: lngSum / bestRing.length
        };
      }
      return { lat: 0, lng: 0 };
    }

    fetch('https://unpkg.com/globe.gl/example/datasets/ne_110m_admin_0_countries.geojson').then(r => r.json()).then(geojson => {
      GEOJSON_DATA = geojson;
      geojson.features.forEach(f => {
        const center = getCountryCenter(f);
        DATA.push({
          iso: f.properties.ISO_A3,
          name: f.properties.ADMIN,
          lat: center.lat,
          lng: center.lng,
          synced: false,
          scores: { pm10: 0, pm2_5: 0, co: 0, no2: 0, temp: 0 }
        });
      });

      world.polygonsData(geojson.features);
      buildUI();

      // Real-Time Global Synchronization Engine
      const chunkSize = 50;
      for (let i = 0; i < DATA.length; i += chunkSize) {
        const chunk = DATA.slice(i, i + chunkSize);
        const lats = chunk.map(c => parseFloat(c.lat).toFixed(2)).join(',');
        const lngs = chunk.map(c => parseFloat(c.lng).toFixed(2)).join(',');
        
        Promise.all([
          fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lats}&longitude=${lngs}&current=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide`),
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lngs}&current=temperature_2m`)
        ]).then(resps => Promise.all(resps.map(r => r.json())))
          .then(([aq, tmp]) => {
             const aqR = Array.isArray(aq) ? aq : [aq];
             const tmpR = Array.isArray(tmp) ? tmp : [tmp];
             chunk.forEach((c, idx) => {
                if (aqR[idx]?.current) {
                    c.scores.pm10 = Math.round(aqR[idx].current.pm10 || 0);
                    c.scores.pm2_5 = Math.round(aqR[idx].current.pm2_5 || 0);
                    c.scores.co = Math.round(aqR[idx].current.carbon_monoxide || 0);
                    c.scores.no2 = Math.round(aqR[idx].current.nitrogen_dioxide || 0);
                }
                if (tmpR[idx]?.current) {
                    c.scores.temp = Math.round(tmpR[idx].current.temperature_2m || 0);
                }
                c.synced = true;
             });
             buildUI();
             refreshColors();
          }).catch(err => console.error("Index Batch err", err));
      }
    });

    function buildUI() {
        const mBtns = document.getElementById('metric-btns');
        if (!mBtns) return;
        mBtns.innerHTML = '';
        METRICS.forEach(m => {
            const btn = document.createElement('div');
            btn.className = `metric-btn ${curMetric === m.key ? 'active' : ''}`;
            btn.onclick = () => selectMetric(m.key);
            btn.innerHTML = `<div class="btn-title">${m.icon} ${m.label}</div><div class="btn-value">${curMetric === m.key ? 'UP-TO-DATE' : 'STANDBY'}</div>`;
            mBtns.appendChild(btn);
        });

        const topList = document.getElementById('top-list');
        if (!topList) return;
        topList.innerHTML = '';
        [...DATA].filter(x => x.synced).sort((a,b) => b.scores[curMetric] - a.scores[curMetric]).slice(0, 5).forEach(c => {
            const item = document.createElement('div');
            item.className = 'leader-item';
            item.style.borderLeftColor = '#00e5ff';
            item.onclick = () => openDetail(c);
            item.innerHTML = `<div class="leader-content"><div class="leader-country"><span class="leader-flag">${c.iso}</span> ${c.name}</div><div class="leader-score">${c.scores[curMetric]}</div></div>`;
            topList.appendChild(item);
        });

        const distStats = document.getElementById('dist-stats');
        if (distStats) {
            const syncedData = DATA.filter(x => x.synced);
            if (syncedData.length > 0) {
                const values = syncedData.map(x => x.scores[curMetric]);
                const avg = Math.round(values.reduce((sum, v) => sum + v, 0) / values.length);
                const max = Math.max(...values);
                const min = Math.min(...values);
                const unit = curMetric === 'temp' ? '°C' : 'µg/m³';
                
                const getPercent = (v) => {
                    if (curMetric === 'temp') {
                        return Math.max(0, Math.min(100, ((v + 10) / 55) * 100));
                    }
                    return Math.max(0, Math.min(100, (v / 100) * 100));
                };

                const avgPercent = getPercent(avg);
                const maxPercent = getPercent(max);
                const minPercent = getPercent(min);
                
                distStats.innerHTML = `
                    <div class="slabel">GLOBAL TELEMETRY STATS</div>
                    <div class="dist-row">
                        <span>GLOBAL AVERAGE</span>
                        <span>${avg} ${unit}</span>
                    </div>
                    <div class="dist-bar-bg">
                        <div class="dist-bar-fill" style="width: ${avgPercent}%; background: #00e5ff;"></div>
                    </div>
                    <div class="dist-row">
                        <span>HIGHEST REGION</span>
                        <span>${max} ${unit}</span>
                    </div>
                    <div class="dist-bar-bg">
                        <div class="dist-bar-fill" style="width: ${maxPercent}%; background: #ef4444;"></div>
                    </div>
                    <div class="dist-row">
                        <span>LOWEST REGION</span>
                        <span>${min} ${unit}</span>
                    </div>
                    <div class="dist-bar-bg">
                        <div class="dist-bar-fill" style="width: ${minPercent}%; background: #10b981;"></div>
                    </div>
                `;
            } else {
                distStats.innerHTML = `
                    <div class="slabel">GLOBAL TELEMETRY STATS</div>
                    <div style="font-family: 'Roboto Mono', monospace; font-size: 11px; color: #64748b;">
                        Connecting to climate intelligence network...
                    </div>
                `;
            }
        }
    }

    function selectMetric(key) {
        curMetric = key;
        const mb = document.getElementById('metric-badge');
        if (mb) mb.textContent = `TRACKING: ${METRICS.find(m => m.key === key).label.toUpperCase()}`;
        buildUI();
        refreshColors();
    }

    function openDetail(c) {
        const val = c.scores[curMetric] || 0;
        const unit = curMetric === 'temp' ? '°C' : 'µg/m³';
        const rank = [...DATA].sort((a,b) => b.scores[curMetric] - a.scores[curMetric]).findIndex(x => x.iso === c.iso) + 1;
        const total = DATA.length;

        let risk = 'SAFE';
        let riskColor = '#10b981';
        if (curMetric === 'temp') {
            if (val > 35) { risk = 'EXTREME HEAT'; riskColor = '#ef4444'; }
            else if (val > 25) { risk = 'WARM'; riskColor = '#f59e0b'; }
            else if (val > 10) { risk = 'TEMPERATE'; riskColor = '#10b981'; }
            else { risk = 'COOL'; riskColor = '#3b82f6'; }
        } else {
            if (val >= 80) { risk = 'HAZARDOUS'; riskColor = '#8b5cf6'; }
            else if (val >= 50) { risk = 'UNHEALTHY'; riskColor = '#ef4444'; }
            else if (val >= 20) { risk = 'MODERATE'; riskColor = '#f59e0b'; }
            else { risk = 'SAFE'; riskColor = '#10b981'; }
        }

        // Set dynamic panel variables
        const rgbMap = {
            '#10b981': '16, 185, 129',
            '#f59e0b': '245, 158, 11',
            '#ef4444': '239, 68, 68',
            '#8b5cf6': '139, 92, 246',
            '#3b82f6': '59, 130, 246'
        };
        const rgb = rgbMap[riskColor] || '0, 229, 255';
        document.getElementById('right').style.setProperty('--country-accent', riskColor);
        document.getElementById('right').style.setProperty('--country-accent-rgb', rgb);

        const detailsHtml = `
            <div class="det-hdr">
                <span class="det-flag">${c.iso}</span>
                <button class="close-btn" onclick="closeDetail()">×</button>
            </div>
            <div class="det-name">${c.name}</div>
            <div class="det-iso">LAT: ${parseFloat(c.lat).toFixed(2)} · LNG: ${parseFloat(c.lng).toFixed(2)}</div>
            
            <div class="score-blk">
                <span class="det-score">${val}</span>
                <span class="score-den">${unit}</span>
            </div>
            <div class="det-risk" style="color: ${riskColor}">${risk}</div>

            <div class="slabel">24-HOUR TREND</div>
            <div id="hourly-timeline" class="hourly-timeline">
                <div class="detail-loading">Loading trend telemetry...</div>
            </div>

            <div class="slabel">REGIONAL EXTREMES</div>
            <div id="regional-extremes" class="regional-extremes">
                <div class="detail-loading">Loading regional extremities...</div>
            </div>

            <div class="info-box">
                <span>ℹ️</span>
                <div>Real-time climate telemetry synced from Open-Meteo & Nominatim APIs.</div>
            </div>

            <div class="slabel">ALL CURRENT METRICS</div>
            <div class="mlist-row">
                <div class="mlist-lbl">🌫️ PM10</div>
                <div class="mlist-val">${c.scores.pm10} µg/m³</div>
            </div>
            <div class="mlist-row">
                <div class="mlist-lbl">😷 PM2.5</div>
                <div class="mlist-val">${c.scores.pm2_5} µg/m³</div>
            </div>
            <div class="mlist-row">
                <div class="mlist-lbl">🚗 Carbon Monoxide</div>
                <div class="mlist-val">${c.scores.co} µg/m³</div>
            </div>
            <div class="mlist-row">
                <div class="mlist-lbl">🏭 Nitrogen Dioxide</div>
                <div class="mlist-val">${c.scores.no2} µg/m³</div>
            </div>
            <div class="mlist-row">
                <div class="mlist-lbl">🌡️ Temperature</div>
                <div class="mlist-val">${c.scores.temp} °C</div>
            </div>

            <div class="rank-box">
                <div class="rank-lbl">GLOBAL RANK</div>
                <div>
                    <span class="rank-num">#${rank}</span>
                    <span class="rank-of">of ${total}</span>
                </div>
            </div>
        `;

        document.getElementById('detail-content').innerHTML = detailsHtml;
        document.getElementById('right').classList.add('active');
        world.controls().autoRotate = false;
        
        world.pointOfView({ lat: c.lat, lng: c.lng, altitude: 1.2 }, 1000);

        // 1. Fetch Hourly Timeline
        Promise.all([
            fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${c.lat}&longitude=${c.lng}&hourly=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide&forecast_days=1`),
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lng}&hourly=temperature_2m&forecast_days=1`)
        ]).then(resps => Promise.all(resps.map(r => r.json())))
          .then(([aqHourly, tmpHourly]) => {
              const timelineEl = document.getElementById('hourly-timeline');
              if (!timelineEl) return;
              
              let hourlyTimes = tmpHourly.hourly.time;
              let values = [];
              let formatVal = (v) => v;
              
              if (curMetric === 'temp') {
                  values = tmpHourly.hourly.temperature_2m;
                  formatVal = (v) => `${Math.round(v)}°C`;
              } else if (curMetric === 'pm10') {
                  values = aqHourly.hourly.pm10;
                  formatVal = (v) => `${Math.round(v)} µg`;
              } else if (curMetric === 'pm2_5') {
                  values = aqHourly.hourly.pm2_5;
                  formatVal = (v) => `${Math.round(v)} µg`;
              } else if (curMetric === 'co') {
                  values = aqHourly.hourly.carbon_monoxide;
                  formatVal = (v) => `${Math.round(v)} µg`;
              } else if (curMetric === 'no2') {
                  values = aqHourly.hourly.nitrogen_dioxide;
                  formatVal = (v) => `${Math.round(v)} µg`;
              }

              timelineEl.innerHTML = '';
              hourlyTimes.forEach((timeStr, idx) => {
                  const hour = new Date(timeStr).getHours();
                  const hourLabel = hour === 0 ? '12 AM' : hour === 12 ? '12 PM' : hour > 12 ? `${hour-12} PM` : `${hour} AM`;
                  
                  const card = document.createElement('div');
                  card.className = 'hourly-card';
                  card.innerHTML = `
                      <div class="hourly-time">${hourLabel}</div>
                      <div class="hourly-val">${formatVal(values[idx])}</div>
                  `;
                  timelineEl.appendChild(card);
              });
          }).catch(err => {
              console.error("Hourly fetch error:", err);
              const el = document.getElementById('hourly-timeline');
              if (el) el.innerHTML = '<div class="detail-error">Failed to load trend data.</div>';
          });

        // 2. Fetch Regional Extremes (Hottest/Coolest or Highest/Lowest regions)
        const extremesEl = document.getElementById('regional-extremes');
        if (extremesEl) {
            const citiesMap = {
                'USA': [
                    { name: 'New York', lat: 40.7128, lng: -74.0060 },
                    { name: 'Los Angeles', lat: 34.0522, lng: -118.2437 },
                    { name: 'Chicago', lat: 41.8781, lng: -87.6298 },
                    { name: 'Houston', lat: 29.7604, lng: -95.3698 },
                    { name: 'Miami', lat: 25.7617, lng: -80.1918 }
                ],
                'GBR': [
                    { name: 'London', lat: 51.5074, lng: -0.1278 },
                    { name: 'Birmingham', lat: 52.4862, lng: -1.8904 },
                    { name: 'Manchester', lat: 53.4808, lng: -2.2426 },
                    { name: 'Glasgow', lat: 55.8642, lng: -4.2518 },
                    { name: 'Belfast', lat: 54.5973, lng: -5.9301 }
                ],
                'FRA': [
                    { name: 'Paris', lat: 48.8566, lng: 2.3522 },
                    { name: 'Marseille', lat: 43.2965, lng: 5.3698 },
                    { name: 'Lyon', lat: 45.7640, lng: 4.8357 },
                    { name: 'Toulouse', lat: 43.6047, lng: 1.4442 },
                    { name: 'Nice', lat: 43.7102, lng: 7.2620 }
                ],
                'DEU': [
                    { name: 'Berlin', lat: 52.5200, lng: 13.4050 },
                    { name: 'Munich', lat: 48.1351, lng: 11.5820 },
                    { name: 'Hamburg', lat: 53.5511, lng: 9.9937 },
                    { name: 'Frankfurt', lat: 50.1109, lng: 8.6821 },
                    { name: 'Cologne', lat: 50.9375, lng: 6.9603 }
                ],
                'IND': [
                    { name: 'Mumbai', lat: 19.0760, lng: 72.8777 },
                    { name: 'Delhi', lat: 28.7041, lng: 77.1025 },
                    { name: 'Bangalore', lat: 12.9716, lng: 77.5946 },
                    { name: 'Kolkata', lat: 22.5726, lng: 88.3639 },
                    { name: 'Chennai', lat: 13.0827, lng: 80.2707 }
                ],
                'CHN': [
                    { name: 'Beijing', lat: 39.9042, lng: 116.4074 },
                    { name: 'Shanghai', lat: 31.2304, lng: 121.4737 },
                    { name: 'Guangzhou', lat: 23.1291, lng: 113.2644 },
                    { name: 'Chengdu', lat: 30.5728, lng: 104.0668 },
                    { name: 'Shenzhen', lat: 22.5431, lng: 114.0579 }
                ],
                'JPN': [
                    { name: 'Tokyo', lat: 35.6762, lng: 139.6503 },
                    { name: 'Osaka', lat: 34.6937, lng: 135.5023 },
                    { name: 'Kyoto', lat: 35.0116, lng: 135.7681 },
                    { name: 'Sapporo', lat: 43.0618, lng: 141.3545 },
                    { name: 'Fukuoka', lat: 33.5902, lng: 130.4017 }
                ],
                'BRA': [
                    { name: 'São Paulo', lat: -23.5505, lng: -46.6333 },
                    { name: 'Rio de Janeiro', lat: -22.9068, lng: -43.1729 },
                    { name: 'Brasília', lat: -15.7975, lng: -47.8919 },
                    { name: 'Salvador', lat: -12.9777, lng: -38.5016 },
                    { name: 'Manaus', lat: -3.1190, lng: -60.0217 }
                ],
                'CAN': [
                    { name: 'Toronto', lat: 43.6532, lng: -79.3832 },
                    { name: 'Vancouver', lat: 49.2827, lng: -123.1207 },
                    { name: 'Montreal', lat: 45.5017, lng: -73.5673 },
                    { name: 'Calgary', lat: 51.0447, lng: -114.0719 },
                    { name: 'Ottawa', lat: 45.4215, lng: -75.6972 }
                ],
                'AUS': [
                    { name: 'Sydney', lat: -33.8688, lng: 151.2093 },
                    { name: 'Melbourne', lat: -37.8136, lng: 144.9631 },
                    { name: 'Brisbane', lat: -27.4705, lng: 153.0260 },
                    { name: 'Perth', lat: -31.9505, lng: 115.8605 },
                    { name: 'Adelaide', lat: -34.9285, lng: 138.6007 }
                ]
            };

            const getCities = () => {
                if (citiesMap[c.iso]) return citiesMap[c.iso];
                const lat = parseFloat(c.lat);
                const lng = parseFloat(c.lng);
                const delta = 1.8;
                return [
                    { name: 'Central Region', lat: lat, lng: lng },
                    { name: 'Northern Region', lat: lat + delta, lng: lng },
                    { name: 'Southern Region', lat: lat - delta, lng: lng },
                    { name: 'Eastern Region', lat: lat, lng: lng + delta },
                    { name: 'Western Region', lat: lat, lng: lng - delta }
                ];
            };

            const cities = getCities();
            const lats = cities.map(city => parseFloat(city.lat).toFixed(4)).join(',');
            const lngs = cities.map(city => parseFloat(city.lng).toFixed(4)).join(',');

            Promise.all([
                fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lats}&longitude=${lngs}&current=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide`),
                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lngs}&current=temperature_2m`)
            ]).then(resps => Promise.all(resps.map(r => r.json())))
              .then(([aqCities, tmpCities]) => {
                  const aqR = Array.isArray(aqCities) ? aqCities : [aqCities];
                  const tmpR = Array.isArray(tmpCities) ? tmpCities : [tmpCities];

                  const cityData = cities.map((city, idx) => {
                      const scores = { pm10: 0, pm2_5: 0, co: 0, no2: 0, temp: 0 };
                      if (aqR[idx]?.current) {
                          scores.pm10 = Math.round(aqR[idx].current.pm10 || 0);
                          scores.pm2_5 = Math.round(aqR[idx].current.pm2_5 || 0);
                          scores.co = Math.round(aqR[idx].current.carbon_monoxide || 0);
                          scores.no2 = Math.round(aqR[idx].current.nitrogen_dioxide || 0);
                      }
                      if (tmpR[idx]?.current) {
                          scores.temp = Math.round(tmpR[idx].current.temperature_2m || 0);
                      }
                      return { name: city.name, score: scores[curMetric] };
                  });

                  cityData.sort((a, b) => b.score - a.score);
                  const highest = cityData[0];
                  const lowest = cityData[cityData.length - 1];

                  let highLabel = 'HIGHEST';
                  let lowLabel = 'LOWEST';
                  let highEmoji = '🔺';
                  let lowEmoji = '🔻';
                  let formatExt = (v) => `${v} µg/m³`;

                  if (curMetric === 'temp') {
                      highLabel = 'HOTTEST';
                      lowLabel = 'COOLEST';
                      highEmoji = '🔥';
                      lowEmoji = '❄️';
                      formatExt = (v) => `${v}°C`;
                  }

                  extremesEl.innerHTML = `
                      <div class="extreme-card high">
                          <div class="ex-hdr">${highEmoji} ${highLabel}</div>
                          <div class="ex-name">${highest.name}</div>
                          <div class="ex-val">${formatExt(highest.score)}</div>
                      </div>
                      <div class="extreme-card low">
                          <div class="ex-hdr">${lowEmoji} ${lowLabel}</div>
                          <div class="ex-name">${lowest.name}</div>
                          <div class="ex-val">${formatExt(lowest.score)}</div>
                      </div>
                  `;
              }).catch(err => {
                  console.error("City batch weather fetch error:", err);
                  extremesEl.innerHTML = '<div class="detail-error">Failed to query regional metrics.</div>';
              });
        }
    }

    function closeDetail() {
        document.getElementById('right').classList.remove('active');
        world.controls().autoRotate = true;
    }

    // ═══════════════ LOCATION SEARCH ENGINE ═══════════════
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    let debounceTimer;

    searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        clearTimeout(debounceTimer);
        
        if (query.length < 2) {
            searchResults.style.display = 'none';
            return;
        }

        debounceTimer = setTimeout(() => {
            // Local client-side search in DATA countries
            const localMatches = DATA.filter(c => 
                c.name.toLowerCase().includes(query) || 
                c.iso.toLowerCase().includes(query)
            ).slice(0, 5);

            renderSearchResults(localMatches, query);

            // Fallback OSM Nominatim geocoding
            fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=5`)
                .then(r => r.json())
                .then(data => {
                    const combined = [...localMatches];
                    data.forEach(item => {
                        const lat = parseFloat(item.lat);
                        const lng = parseFloat(item.lon);
                        const duplicate = combined.some(c => 
                            Math.abs(c.lat - lat) < 1.0 && Math.abs(c.lng - lng) < 1.0
                        );
                        if (!duplicate) {
                            combined.push({
                                name: item.display_name,
                                iso: 'LOC',
                                lat: lat,
                                lng: lng,
                                isOSM: true
                            });
                        }
                    });
                    renderSearchResults(combined.slice(0, 7), query);
                })
                .catch(err => console.error("Search API error", err));
        }, 250);
    });

    function renderSearchResults(results, query) {
        if (results.length === 0) {
            searchResults.innerHTML = '<li style="color: var(--text-muted); cursor: default; font-size: 11px; padding: 8px 12px;">No results found</li>';
            searchResults.style.display = 'block';
            return;
        }

        searchResults.innerHTML = '';
        searchResults.style.display = 'block';

        results.forEach(res => {
            const li = document.createElement('li');
            const tag = res.iso === 'LOC' ? '📍' : res.iso;
            li.innerHTML = `<span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-accent); background: rgba(0, 229, 255, 0.1); padding: 2px 4px; border-radius: 4px; margin-right: 8px;">${tag}</span> ${res.name}`;
            
            li.onclick = () => {
                world.pointOfView({ lat: res.lat, lng: res.lng, altitude: 1.2 }, 1500);
                if (!res.isOSM) {
                    setTimeout(() => openDetail(res), 1500);
                }
                searchInput.value = '';
                searchResults.style.display = 'none';
            };
            searchResults.appendChild(li);
        });
    }

    document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
            searchResults.style.display = 'none';
        }
    });
    window.addEventListener('resize', () => {
      const wrap = document.getElementById('globe-wrap');
      world.width(wrap.offsetWidth).height(wrap.offsetHeight);
    });
    setTimeout(() => {
      const wrap = document.getElementById('globe-wrap');
      world.width(wrap.offsetWidth).height(wrap.offsetHeight);
    }, 500);
  </script>
</body>
