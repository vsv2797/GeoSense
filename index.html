<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoSense | Global Climate Intelligence</title>
  <link rel="stylesheet" href="css/climate.css">
  <script src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
  <script src="https://unpkg.com/globe.gl@2.26.0/dist/globe.gl.min.js"></script>
</head>

<body>
  <div id="earth-glow"></div>

  <header>
    <div class="logo" onclick="window.location.reload()" style="cursor:pointer">
      <div class="logo-mark">GS</div>
      <div>
        <div class="logo-name">Geo<span>Sense</span></div>
        <div class="logo-tag">GLOBAL CLIMATE INTELLIGENCE</div>
      </div>
    </div>
    <div class="header-right">
      <div class="live-pill">
        <div class="live-dot"></div>
        <span id="country-count">LIVE · SYNCING DATA</span>
      </div>
    </div>
  </header>

  <div id="main">
    <aside id="left">
      <div class="slabel">ANALYTICS ENGINE</div>
      <div id="metric-btns"></div>

      <div class="divider"></div>

      <div class="slabel">CRITICAL IMPACT ZONES</div>
      <div id="top-list"></div>

      <div class="divider" style="margin-top:auto;"></div>
      <div class="dist-wrap" id="dist-stats"></div>
    </aside>

    <main id="globe-wrap">
      <div id="globe-viz"></div>
      <div id="metric-badge">TRACKING: PM2.5</div>
      <div id="legend">
        <span class="leg-lbl">SAFE</span>
        <div class="leg-bar"></div>
        <span class="leg-lbl">HAZARDOUS</span>
      </div>
      <div id="hint">↻ Rotate globe · Scroll to zoom · Click for detail</div>
    </main>

    <aside id="right">
      <div id="right-inner"><div id="detail-content"></div></div>
    </aside>
  </div>

  <!-- Tooltip -->
  <div id="tooltip">
    <div class="tip-inner">
      <span id="t-flag" class="tip-flag"></span>
      <div>
        <div id="t-name" class="tip-name"></div>
        <div id="t-score" class="tip-score"></div>
      </div>
    </div>
  </div>

  <script>
  /* ══════════════════════════════════════
     STATE
  ══════════════════════════════════════ */
  let DATA       = [];
  let curMetric  = 'pm2_5';
  let selCountry = null;

  const METRICS = [
    { key: 'pm2_5', label: 'PM2.5 Particles',  icon: '😷', unit: 'μg/m³', max: 80  },
    { key: 'pm10',  label: 'PM10 Pollutants',   icon: '🌫️', unit: 'μg/m³', max: 150 },
    { key: 'co',    label: 'Carbon Monoxide',   icon: '🚗', unit: 'μg/m³', max: 600 },
    { key: 'no2',   label: 'Nitrogen Dioxide',  icon: '🏭', unit: 'μg/m³', max: 150 },
    { key: 'temp',  label: 'Temperature',       icon: '🌡️', unit: '°C',    max: 50  },
  ];

  /* ══════════════════════════════════════
     COLOUR HELPERS
  ══════════════════════════════════════ */
  function getColor(val, key) {
    if (key === 'temp') {
      const t = Math.max(0, Math.min(1, (val + 30) / 80));
      const stops = [[139,92,246],[59,130,246],[16,185,129],[245,158,11],[239,68,68]];
      const i = Math.min(Math.floor(t * (stops.length - 1)), stops.length - 2);
      const f = t * (stops.length - 1) - i;
      const r = Math.round(stops[i][0] * (1-f) + stops[i+1][0] * f);
      const g = Math.round(stops[i][1] * (1-f) + stops[i+1][1] * f);
      const b = Math.round(stops[i][2] * (1-f) + stops[i+1][2] * f);
      return `rgb(${r},${g},${b})`;
    }
    if (val >= 80)  return '#8b5cf6';
    if (val >= 50)  return '#ef4444';
    if (val >= 20)  return '#f59e0b';
    if (val >= 5)   return '#10b981';
    return '#64748b';
  }

  function getRisk(val, key) {
    if (key === 'temp') {
      if (val > 40) return 'EXTREME HEAT';
      if (val > 25) return 'HOT';
      if (val > 10) return 'MODERATE';
      if (val > 0)  return 'COOL';
      return 'COLD';
    }
    if (val >= 80) return 'HAZARDOUS';
    if (val >= 50) return 'UNHEALTHY';
    if (val >= 20) return 'MODERATE';
    if (val >= 5)  return 'GOOD';
    return 'MINIMAL';
  }

  /* ══════════════════════════════════════
     GLOBE
  ══════════════════════════════════════ */
  const world = Globe()(document.getElementById('globe-viz'))
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
    .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
    .backgroundColor('#020408')
    .showAtmosphere(true)
    .atmosphereColor('lightskyblue')
    .atmosphereAltitude(0.15)
    .polygonCapColor(feat => {
      const c = DATA.find(x => x.iso === feat.properties.ISO_A3);
      if (!c || !c.synced) return 'rgba(2,4,8,0.3)';
      return getColor(c.scores[curMetric], curMetric) + 'b0';
    })
    .polygonSideColor(() => 'rgba(15,23,42,0.4)')
    .polygonStrokeColor(() => 'rgba(255,255,255,0.08)')
    .polygonAltitude(0.012)
    .onPolygonHover(feat => {
      const tt = document.getElementById('tooltip');
      if (!feat) { tt.style.display = 'none'; return; }
      const c = DATA.find(x => x.iso === feat.properties.ISO_A3);
      if (!c) { tt.style.display = 'none'; return; }
      const m = METRICS.find(x => x.key === curMetric);
      const col = getColor(c.scores[curMetric], curMetric);
      document.getElementById('t-flag').textContent  = c.iso;
      document.getElementById('t-name').textContent  = c.name;
      const ts = document.getElementById('t-score');
      ts.textContent = c.synced
        ? `${c.scores[curMetric]} ${m.unit} · ${getRisk(c.scores[curMetric], curMetric)}`
        : 'Syncing...';
      ts.style.color = col;
      tt.style.display = 'block';
    })
    .onPolygonClick(feat => {
      const c = DATA.find(x => x.iso === feat.properties.ISO_A3);
      if (c) openDetail(c);
    });

  document.addEventListener('mousemove', e => {
    const tt = document.getElementById('tooltip');
    if (tt.style.display === 'block') {
      tt.style.left = (e.clientX + 14) + 'px';
      tt.style.top  = (e.clientY - 36) + 'px';
    }
  });

  // Cloud layer
  new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-clouds.png', tex => {
    const clouds = new THREE.Mesh(
      new THREE.SphereGeometry(world.getGlobeRadius() * 1.004, 75, 75),
      new THREE.MeshPhongMaterial({ map: tex, transparent: true, opacity: 0.75, depthWrite: false })
    );
    world.scene().add(clouds);
    (function spin() { clouds.rotation.y += 0.0003; requestAnimationFrame(spin); })();
  });

  world.controls().autoRotate     = true;
  world.controls().autoRotateSpeed = 0.5;
  world.controls().enableDamping  = true;

  window.addEventListener('resize', () => {
    const w = document.getElementById('globe-wrap');
    world.width(w.offsetWidth).height(w.offsetHeight);
  });
  setTimeout(() => {
    const w = document.getElementById('globe-wrap');
    world.width(w.offsetWidth).height(w.offsetHeight);
  }, 300);

  /* ══════════════════════════════════════
     DATA LOADING — batched, choropleth only
  ══════════════════════════════════════ */
  fetch('https://unpkg.com/globe.gl/example/datasets/ne_110m_admin_0_countries.geojson')
    .then(r => r.json())
    .then(geojson => {
      geojson.features.forEach(f => {
        const lat = parseFloat(f.properties.LABEL_Y);
        const lng = parseFloat(f.properties.LABEL_X);
        if (!isNaN(lat) && !isNaN(lng)) {
          DATA.push({
            iso:    f.properties.ISO_A3,
            name:   f.properties.ADMIN || f.properties.NAME,
            cont:   f.properties.CONTINENT || '',
            lat, lng,
            synced: false,
            scores: { pm2_5: 0, pm10: 0, co: 0, no2: 0, temp: 0 }
          });
        }
      });

      world.polygonsData(geojson.features);
      buildUI();
      batchSync();
    });

  function batchSync() {
    const CHUNK = 50;
    let done = 0;
    for (let i = 0; i < DATA.length; i += CHUNK) {
      const chunk = DATA.slice(i, i + CHUNK);
      const lats  = chunk.map(c => c.lat.toFixed(2)).join(',');
      const lngs  = chunk.map(c => c.lng.toFixed(2)).join(',');

      Promise.all([
        fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lats}&longitude=${lngs}&current=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide`).then(r => r.json()),
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lngs}&current=temperature_2m`).then(r => r.json())
      ]).then(([aq, tmp]) => {
        const aqArr  = Array.isArray(aq)  ? aq  : [aq];
        const tmpArr = Array.isArray(tmp) ? tmp : [tmp];
        chunk.forEach((c, idx) => {
          if (aqArr[idx]?.current) {
            c.scores.pm2_5 = Math.round(aqArr[idx].current.pm2_5            || 0);
            c.scores.pm10  = Math.round(aqArr[idx].current.pm10             || 0);
            c.scores.co    = Math.round(aqArr[idx].current.carbon_monoxide  || 0);
            c.scores.no2   = Math.round(aqArr[idx].current.nitrogen_dioxide || 0);
          }
          if (tmpArr[idx]?.current) {
            c.scores.temp = Math.round(tmpArr[idx].current.temperature_2m || 0);
          }
          c.synced = true;
        });
        done += chunk.length;
        // Refresh globe choropleth colors
        world.polygonCapColor(world.polygonCapColor());
        buildUI();
        const synced = DATA.filter(x => x.synced).length;
        document.getElementById('country-count').textContent =
          `LIVE · ${synced} / ${DATA.length} REGIONS`;
        // Refresh open detail panel if visible
        if (selCountry) {
          const fresh = DATA.find(x => x.iso === selCountry.iso);
          if (fresh) openDetail(fresh);
        }
      }).catch(err => console.error('Batch error', err));
    }
  }

  /* ══════════════════════════════════════
     UI BUILDERS
  ══════════════════════════════════════ */
  function buildUI() {
    buildMetricBtns();
    buildTopList();
    buildDistStats();
  }

  function buildMetricBtns() {
    const el = document.getElementById('metric-btns');
    if (!el) return;
    el.innerHTML = '';
    METRICS.forEach(m => {
      const synced = DATA.filter(x => x.synced);
      const avg = synced.length
        ? (synced.reduce((s, c) => s + (c.scores[m.key] || 0), 0) / synced.length).toFixed(1)
        : '--';
      const btn = document.createElement('div');
      btn.className = 'metric-btn' + (curMetric === m.key ? ' active' : '');
      btn.innerHTML = `<div class="btn-title">${m.icon} ${m.label}</div><div class="btn-value">AVG ${avg} ${m.unit}</div>`;
      btn.onclick = () => selectMetric(m.key);
      el.appendChild(btn);
    });
  }

  function buildTopList() {
    const el = document.getElementById('top-list');
    if (!el) return;
    el.innerHTML = '';
    const synced = DATA.filter(x => x.synced);
    if (!synced.length) {
      el.innerHTML = '<div style="font-family:\'Roboto Mono\',monospace;font-size:9px;color:#334155;padding:8px 0">Syncing regions...</div>';
      return;
    }
    [...synced]
      .sort((a, b) => (b.scores[curMetric] || 0) - (a.scores[curMetric] || 0))
      .slice(0, 6)
      .forEach(c => {
        const val = c.scores[curMetric];
        const col = getColor(val, curMetric);
        const m   = METRICS.find(x => x.key === curMetric);
        const pct = Math.min(100, (val / m.max) * 100).toFixed(0);
        const div = document.createElement('div');
        div.className = 'leader-item';
        div.style.borderLeftColor = col;
        div.innerHTML = `
          <div class="leader-bg-bar" style="width:${pct}%;background:${col}"></div>
          <div class="leader-content">
            <div class="leader-country"><span class="leader-flag">${c.iso}</span>${c.name}</div>
            <div class="leader-score" style="color:${col}">${val}</div>
          </div>`;
        div.onclick = () => openDetail(c);
        el.appendChild(div);
      });
  }

  function buildDistStats() {
    const el = document.getElementById('dist-stats');
    if (!el) return;
    const synced = DATA.filter(x => x.synced);
    if (!synced.length) return;
    const m    = METRICS.find(x => x.key === curMetric);
    const vals = synced.map(x => x.scores[curMetric]);
    const avg  = (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
    const max  = Math.max(...vals);
    const maxC = synced.reduce((a, b) => b.scores[curMetric] > a.scores[curMetric] ? b : a);
    el.innerHTML = `
      <div class="slabel">GLOBAL AGGREGATE</div>
      <div class="dist-row"><span>Average</span><b style="font-family:'Roboto Mono',monospace;font-size:10px">${avg} ${m.unit}</b></div>
      <div class="dist-bar-bg"><div class="dist-bar-fill" style="width:${Math.min(100,(avg/m.max)*100).toFixed(0)}%;background:${getColor(parseFloat(avg), curMetric)}"></div></div>
      <div class="dist-row"><span>Peak</span><b style="font-family:'Roboto Mono',monospace;font-size:10px;color:${getColor(max, curMetric)}">${max} ${m.unit}</b></div>
      <div class="dist-row" style="font-size:10px;color:#475569">Worst Region</div>
      <div class="dist-row"><b style="font-family:'Roboto Mono',monospace;font-size:10px;color:#94a3b8">${maxC.iso} — ${maxC.name}</b></div>
    `;
  }

  function selectMetric(key) {
    curMetric = key;
    const m   = METRICS.find(x => x.key === key);
    document.getElementById('metric-badge').textContent = `TRACKING: ${m.label.toUpperCase()}`;
    buildUI();
    world.polygonCapColor(world.polygonCapColor());
    if (selCountry) openDetail(selCountry);
  }

  /* ══════════════════════════════════════
     DETAIL PANEL
  ══════════════════════════════════════ */
  function openDetail(c) {
    selCountry = c;
    world.controls().autoRotate = false;
    world.pointOfView({ lat: c.lat, lng: c.lng, altitude: 1.8 }, 900);

    const m   = METRICS.find(x => x.key === curMetric);
    const val = c.scores[curMetric];
    const col = getColor(val, curMetric);
    const lbl = getRisk(val, curMetric);

    const sorted = DATA.filter(x => x.synced).sort((a, b) => b.scores[curMetric] - a.scores[curMetric]);
    const rank   = sorted.findIndex(x => x.iso === c.iso) + 1;

    // Build all metric rows
    const metricRows = METRICS.map(mx => {
      const mv  = c.scores[mx.key];
      const mc  = getColor(mv, mx.key);
      const pct = Math.min(100, (mv / mx.max) * 100).toFixed(0);
      return `
        <div class="mlist-row">
          <div class="mlist-lbl">${mx.icon} ${mx.label}</div>
          <div class="mlist-val" style="color:${mc}">${c.synced ? mv : '--'} <span style="font-size:9px;opacity:0.5">${mx.unit}</span></div>
        </div>`;
    }).join('');

    document.getElementById('detail-content').innerHTML = `
      <div class="det-hdr">
        <div class="det-flag" style="background:${col};color:#020408">${c.iso}</div>
        <button class="close-btn" onclick="closeDetail()">✕</button>
      </div>
      <div class="det-name">${c.name}</div>
      <div class="det-iso">${c.cont.toUpperCase()} · REGION DATA</div>
      <div class="score-blk">
        <div class="det-score" style="color:${col}">${c.synced ? val : '--'}</div>
        <div class="score-den">${m.unit}</div>
      </div>
      <div class="det-risk" style="color:${col}">${lbl}</div>
      <div class="slabel" style="margin-top:4px;margin-bottom:8px">ALL METRICS</div>
      ${metricRows}
      <div class="rank-box">
        <div>
          <div class="rank-lbl">GLOBAL RANK</div>
          <div class="rank-num" style="color:${col}">${rank ? '#' + rank : '--'}</div>
          <div class="rank-of">of ${sorted.length} synced regions</div>
        </div>
      </div>`;

    document.getElementById('right').classList.add('active');
  }

  function closeDetail() {
    document.getElementById('right').classList.remove('active');
    selCountry = null;
    world.controls().autoRotate = true;
  }
  </script>
</body>
</html>
